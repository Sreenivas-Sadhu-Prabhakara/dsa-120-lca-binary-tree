<text x="56.0" y="586.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">LCA(4,6) = 1; LCA(4,5) = 2 (both under the same child → the split happens lower).</text>
